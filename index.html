<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расписание</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            color: #4f46e5;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        input[type='date'],
        input[type='text'],
        select {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #d1d5db;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .autocomplete-list.visible {
            display: block;
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f3f4f6;
        }

        .autocomplete-item:hover,
        .autocomplete-item.highlighted {
            background: #eff6ff;
        }

        .autocomplete-item strong {
            color: #4f46e5;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 24px;
        }

        .tab-button {
            padding: 12px 24px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: #6b7280;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
        }

        .tab-button:hover {
            color: #4f46e5;
        }

        .tab-button.active {
            color: #4f46e5;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #4f46e5;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .selector {
            margin-bottom: 24px;
            display: none;
        }

        .selector.visible {
            display: block;
        }

        .lesson {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .lesson-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .lesson-number {
            background: #e0e7ff;
            color: #4338ca;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .lesson-content {
            margin-left: 44px;
        }

        .lesson-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 12px;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-right: 8px;
        }

        .badge-type {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-partner {
            background: #d1fae5;
            color: #065f46;
        }

        .schedule-header {
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .schedule-date {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
        }

        .no-lessons,
        .loading {
            text-align: center;
            color: #6b7280;
            padding: 40px;
        }

        @media (max-width: 640px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>
                <span class="icon">📅</span>
                Расписание
            </h1>

            <div class="tabs">
                <button class="tab-button active" data-tab="by-day">
                    По дням
                </button>
                <button class="tab-button" data-tab="by-discipline">
                    По дисциплине
                </button>
            </div>

            <div id="by-day" class="tab-content active">
                <div class="controls">
                    <div class="input-group">
                        <label for="clientInput">
                            Группа или преподаватель
                        </label>
                        <input type="text" id="clientInput" placeholder="Начните вводить..." autocomplete="off" />
                        <div id="autocompleteList" class="autocomplete-list"></div>
                    </div>
                    <div class="input-group">
                        <label for="dateInput">Выберите дату</label>
                        <input type="date" id="dateInput" />
                    </div>
                </div>
                <div id="errorContainer"></div>
            </div>

            <div id="by-discipline" class="tab-content">
                <div class="controls">
                    <div class="input-group">
                        <label for="teacherInput">Преподаватель</label>
                        <input type="text" id="teacherInput" placeholder="Начните вводить ФИО..." autocomplete="off" />
                        <div id="teacherAutocompleteList" class="autocomplete-list"></div>
                    </div>
                </div>
                <div class="selector" id="semesterSelector">
                    <label for="semesterSelect">Выберите семестр</label>
                    <select id="semesterSelect">
                        <option value="">Выберите семестер</option>
                    </select>
                </div>
                <div class="selector" id="disciplineSelector">
                    <label for="disciplineSelect">
                        Выберите дисциплину
                    </label>
                    <select id="disciplineSelect">
                        <option value="">Выберите дисциплину</option>
                    </select>
                </div>
                <div class="selector" id="groupSelector">
                    <label for="groupSelect">Выберите группу</label>
                    <select id="groupSelect">
                        <option value="">Все группы</option>
                    </select>
                </div>
                <div id="errorContainerDiscipline"></div>
            </div>
        </div>

        <div id="scheduleContainer" class="card" style="display: none"></div>
        <div id="disciplineScheduleContainer" class="card" style="display: none"></div>
    </div>

    <script>
        const state = {
            clients: [],
            teachers: [],
            selectedClient: '',
            selectedTeacher: '',
            scheduleData: null,       // полные данные по преподавателю (отфильтрованные по семестру)
            subjects: [],
            storage: {},
            currentSemester: null,    // текущий выбранный семестр { value, label, startDate, endDate }
        }

        const weekDays = [
            'Понедельник',
            'Вторник',
            'Среда',
            'Четверг',
            'Пятница',
            'Суббота',
            'Воскресенье',
        ]

        // --- Хранилище (localStorage имитация через объект) ---
        function save(key, val) {
            state.storage[key] = val
            localStorage.setItem(key, val)
        }
        function load(key) {
            if (state.storage[key]) return state.storage[key]
            const fromStorage = localStorage.getItem(key)
            if (fromStorage) state.storage[key] = fromStorage
            return state.storage[key] || ''
        }

        // --- Генерация списка семестров с датами ---
        function generateSemesters() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth();
            const startYear = 2025;
            const semesters = [];

            for (let year = startYear; year <= currentYear; year++) {
                // 1 семестр: январь – июль
                semesters.push({
                    value: `${year}-1`,
                    label: `${year} — 1 семестр (янв–июл)`,
                    startDate: `${year}-01-01`,
                    endDate: `${year}-07-31`
                });

                // 2 семестр: сентябрь – декабрь (если год меньше текущего или месяц >= сентябрь)
                const canShowSecond = (year < currentYear) || (currentMonth >= 8);
                if (canShowSecond) {
                    semesters.push({
                        value: `${year}-2`,
                        label: `${year} — 2 семестр (сен–дек)`,
                        startDate: `${year}-09-01`,
                        endDate: `${year}-12-31`
                    });
                }
            }
            // сортируем от новых к старым (последний семестр первым)
            return semesters.reverse();
        }

        function getSemesterByValue(value) {
            return generateSemesters().find(s => s.value === value);
        }

        function populateSemesterSelect() {
            const semesters = generateSemesters();
            const select = document.getElementById('semesterSelect');
            select.innerHTML = '<option value="">— Выберите семестр —</option>';
            semesters.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.value;
                opt.textContent = s.label;
                select.appendChild(opt);
            });
            // выбрать последний (текущий) семестр
            if (semesters.length) {
                select.value = semesters[0].value;
                state.currentSemester = semesters[0];
            } else {
                state.currentSemester = null;
            }
        }

        // --- Загрузка расписания для преподавателя с учётом выбранного семестра ---
        async function loadTeacherScheduleForSemester() {
            if (!state.selectedTeacher) return;
            if (!state.currentSemester) {
                showError('Семестр не выбран', errorContainerDiscipline);
                return;
            }

            const disciplineSelector = document.getElementById('disciplineSelector');
            const groupSelector = document.getElementById('groupSelector');
            const disciplineScheduleContainer = document.getElementById('disciplineScheduleContainer');

            disciplineSelector.classList.remove('visible');
            groupSelector.classList.remove('visible');
            disciplineScheduleContainer.style.display = 'none';

            try {
                // Отправляем начало семестра в UTC, чтобы сервер вернул данные в правильной временной зоне
                const startDateISO = new Date(state.currentSemester.startDate + 'T00:00:00').toISOString();
                const res = await fetch(
                    `https://app.omsktec.ru/api/schedule?client_name=${encodeURIComponent(state.selectedTeacher)}`,
                    { headers: { 'X-CLIENT-TIME': startDateISO } }
                );
                const data = await res.json();

                // Фильтруем расписание по датам семестра (на случай, если сервер вернул лишние дни)
                const filteredSchedules = data.schedules.filter(schedule => {
                    return schedule.date >= state.currentSemester.startDate && schedule.date <= state.currentSemester.endDate;
                });
                state.scheduleData = { ...data, schedules: filteredSchedules };

                // Извлечь уникальные дисциплины из отфильтрованных данных
                const subjectSet = new Set();
                state.scheduleData.schedules.forEach(s => {
                    s.lessons?.forEach(l => {
                        l.items?.forEach(item => subjectSet.add(item.title));
                    });
                });
                state.subjects = Array.from(subjectSet).sort();

                const disciplineSelect = document.getElementById('disciplineSelect');
                disciplineSelect.innerHTML = '<option value="">— Выберите дисциплину —</option>';
                state.subjects.forEach(subj => {
                    const opt = document.createElement('option');
                    opt.value = subj;
                    opt.textContent = subj;
                    disciplineSelect.appendChild(opt);
                });

                // Показать селекторы
                document.getElementById('semesterSelector').classList.add('visible');
                disciplineSelector.classList.add('visible');

                // Восстановить последнюю выбранную дисциплину
                const lastSubj = load('lastSubject');
                if (lastSubj && state.subjects.includes(lastSubj)) {
                    disciplineSelect.value = lastSubj;
                    onSubjectChange(lastSubj);
                } else if (state.subjects.length) {
                    disciplineSelect.value = state.subjects[0];
                    onSubjectChange(state.subjects[0]);
                } else {
                    disciplineScheduleContainer.innerHTML = '<div class="no-lessons">Нет дисциплин за выбранный семестр</div>';
                    disciplineScheduleContainer.style.display = 'block';
                }

            } catch (err) {
                showError('Ошибка загрузки: ' + err.message, errorContainerDiscipline);
            }
        }

        // --- Обработчик смены семестра ---
        const semesterSelect = document.getElementById('semesterSelect');
        if (semesterSelect) {
            semesterSelect.addEventListener('change', (e) => {
                const semValue = e.target.value;
                if (semValue) {
                    const semester = getSemesterByValue(semValue);
                    if (semester) {
                        state.currentSemester = semester;
                        if (state.selectedTeacher) {
                            loadTeacherScheduleForSemester();
                        }
                    }
                } else {
                    state.currentSemester = null;
                    document.getElementById('disciplineSelector').classList.remove('visible');
                    document.getElementById('groupSelector').classList.remove('visible');
                    document.getElementById('disciplineScheduleContainer').style.display = 'none';
                }
            });
        }

        // --- Функции для работы с дисциплинами и группами ---
        function getGroups(subject) {
            const groups = new Set();
            if (!state.scheduleData) return [];
            state.scheduleData.schedules.forEach(s => {
                s.lessons?.forEach(l => {
                    l.items?.forEach(item => {
                        if (item.title === subject) groups.add(item.partner);
                    });
                });
            });
            return Array.from(groups).sort();
        }

        function onSubjectChange(subject) {
            if (!subject) return;
            const groups = getGroups(subject);
            const groupSelect = document.getElementById('groupSelect');
            const groupSelector = document.getElementById('groupSelector');
            if (groups.length > 1) {
                groupSelect.innerHTML = '<option value="">— Все группы —</option>';
                groups.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    groupSelect.appendChild(opt);
                });
                groupSelector.classList.add('visible');
                const lastGroup = load('lastGroup');
                if (lastGroup && groups.includes(lastGroup)) {
                    groupSelect.value = lastGroup;
                    loadDisciplineSchedule(subject, lastGroup);
                } else {
                    loadDisciplineSchedule(subject, '');
                }
            } else {
                groupSelector.classList.remove('visible');
                loadDisciplineSchedule(subject, '');
            }
        }

        function loadDisciplineSchedule(subject, group = '') {
            if (!state.scheduleData) return;
            const filtered = [];
            state.scheduleData.schedules.forEach(s => {
                const dayLessons = [];
                s.lessons?.forEach(l => {
                    const items = l.items?.filter(i => i.title === subject && (!group || i.partner === group));
                    if (items && items.length) {
                        dayLessons.push({ ...l, items });
                    }
                });
                if (dayLessons.length) {
                    filtered.push({
                        date: s.date,
                        week_day: s.week_day,
                        lessons: dayLessons,
                    });
                }
            });
            renderDisciplineSchedule(filtered, subject, group);
        }

        function renderDisciplineSchedule(days, subject, group) {
            const groupInfo = group ? ` (${group})` : '';
            let html = `<div class="schedule-header">
        <div class="schedule-date">${state.selectedTeacher}</div>
        <div style="color:#6b7280;margin-top:4px">Дисциплина: ${subject}${groupInfo}</div>
        <div style="color:#6b7280;margin-top:4px">Семестр: ${state.currentSemester?.label || ''}</div>
    </div>`;

            if (!days.length) {
                html += '<div class="no-lessons">Занятий не найдено</div>';
            } else {
                days.forEach(day => {
                    html += `<div style="border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:16px">
                <div style="font-size:18px;font-weight:600;margin-bottom:12px">
                    📅 ${day.date} (${weekDays[day.week_day]})
                </div>`;
                    day.lessons.forEach(l => {
                        html += `<div class="lesson">
                    <div class="lesson-header">
                        <div class="lesson-number">${l.number}</div>
                        <div style="color:#6b7280">🕐 ${l.time}</div>
                    </div>`;
                        l.items.forEach(item => {
                            html += `<div class="lesson-content">
                        <div class="lesson-title">📚 ${item.title}</div>
                        <div>
                            <span class="badge badge-type">${item.type}</span>
                            <span class="badge badge-partner">${item.partner}</span>
                            ${item.location ? `<span class="badge">${item.location}</span>` : ''}
                        </div>
                    </div>`;
                        });
                        html += '</div>';
                    });
                    html += '</div>';
                });
            }
            const container = document.getElementById('disciplineScheduleContainer');
            container.innerHTML = html;
            container.style.display = 'block';
            document.getElementById('scheduleContainer').style.display = 'none';
        }

        // --- Загрузка преподавателя (инициализация семестров и данных) ---
        async function loadTeacherSchedule() {
            if (!state.selectedTeacher) return;

            // Скрыть селекторы до загрузки
            document.getElementById('disciplineSelector').classList.remove('visible');
            document.getElementById('semesterSelector').classList.remove('visible');
            document.getElementById('groupSelector').classList.remove('visible');
            document.getElementById('disciplineScheduleContainer').style.display = 'none';

            populateSemesterSelect();
            if (state.currentSemester) {
                await loadTeacherScheduleForSemester();
            } else {
                showError('Нет доступных семестров', errorContainerDiscipline);
            }
        }

        // --- Обработчики для дисциплины и группы ---
        document.getElementById('disciplineSelect')?.addEventListener('change', (e) => {
            const subj = e.target.value;
            if (subj) {
                save('lastSubject', subj);
                onSubjectChange(subj);
            } else {
                document.getElementById('disciplineScheduleContainer').style.display = 'none';
                document.getElementById('groupSelector').classList.remove('visible');
            }
        });

        document.getElementById('groupSelect')?.addEventListener('change', (e) => {
            const group = e.target.value;
            if (group) save('lastGroup', group);
            loadDisciplineSchedule(document.getElementById('disciplineSelect').value, group);
        });

        // --- Вспомогательные функции для автокомплита и общих загрузок ---
        function setupAutocomplete(input, list, onSelect, filterFn) {
            let highlighted = -1;

            input.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                highlighted = -1;
                if (query.length < 1) {
                    list.classList.remove('visible');
                    return;
                }
                const items = filterFn(query);
                renderList(items, query, list, onSelect);
            });

            input.addEventListener('keydown', (e) => {
                const items = list.querySelectorAll('.autocomplete-item');
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    highlighted = Math.min(highlighted + 1, items.length - 1);
                    updateHighlight(items, highlighted);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    highlighted = Math.max(highlighted - 1, -1);
                    updateHighlight(items, highlighted);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (highlighted >= 0 && items[highlighted]) {
                        onSelect(items[highlighted].textContent);
                    } else if (items.length > 0) {
                        onSelect(items[0].textContent);
                    }
                } else if (e.key === 'Escape') {
                    list.classList.remove('visible');
                    highlighted = -1;
                }
            });
        }

        function renderList(items, query, listEl, onSelect) {
            if (!items.length) {
                listEl.innerHTML = '<div class="no-results">Ничего не найдено</div>';
                listEl.classList.add('visible');
                return;
            }
            listEl.innerHTML = '';
            items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerHTML = item.replace(new RegExp(`(${query})`, 'gi'), '<strong>$1</strong>');
                div.onclick = () => onSelect(item);
                listEl.appendChild(div);
            });
            listEl.classList.add('visible');
        }

        function updateHighlight(items, idx) {
            items.forEach((item, i) => {
                if (i === idx) {
                    item.classList.add('highlighted');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('highlighted');
                }
            });
        }

        // --- Загрузка списка клиентов и преподавателей ---
        async function loadClients() {
            try {
                const res = await fetch('https://app.omsktec.ru/api/schedule/clients');
                const data = await res.json();
                state.clients = [...data.groups, ...data.teachers].sort();
                state.teachers = [...data.teachers].sort();

                const lastClient = load('lastClient');
                if (lastClient) {
                    document.getElementById('clientInput').value = lastClient;
                    state.selectedClient = lastClient;
                }
                const lastTeacher = load('lastTeacher');
                if (lastTeacher) {
                    document.getElementById('teacherInput').value = lastTeacher;
                    state.selectedTeacher = lastTeacher;
                }
            } catch (err) {
                showError('Не удалось загрузить список: ' + err.message);
            }
        }

        // --- Загрузка расписания на день (вкладка "По дням") ---
        async function loadSchedule() {
            const name = state.selectedClient || document.getElementById('clientInput').value.trim();
            const date = document.getElementById('dateInput').value;
            if (!name || !date) return;

            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '<div class="loading">Загрузка...</div>';
            container.style.display = 'block';
            document.getElementById('disciplineScheduleContainer').style.display = 'none';

            try {
                const res = await fetch(
                    `https://app.omsktec.ru/api/schedule?client_name=${encodeURIComponent(name)}`,
                    { headers: { 'X-CLIENT-TIME': new Date(date).toISOString() } }
                );
                const data = await res.json();
                if (data.schedules && data.schedules.length) {
                    renderSchedule(data.schedules[0], name);
                } else {
                    container.innerHTML = '<div class="no-lessons">Расписание не найдено</div>';
                }
            } catch (err) {
                showError('Ошибка: ' + err.message);
            }
        }

        function renderSchedule(schedule, name) {
            let html = `<div class="schedule-header">
        <div class="schedule-date">${name}</div>
        <div style="color:#6b7280;margin-top:4px">${schedule.date} - ${weekDays[schedule.week_day]}</div>
    </div>`;

            if (!schedule.lessons || !schedule.lessons.length) {
                html += '<div class="no-lessons">Занятий нет</div>';
            } else {
                schedule.lessons.forEach((lesson) => {
                    html += `<div class="lesson">
                <div class="lesson-header">
                    <div class="lesson-number">${lesson.number}</div>
                    <div style="color:#6b7280">🕐 ${lesson.time}</div>
                </div>`;
                    lesson.items.forEach((item) => {
                        html += `<div class="lesson-content">
                    <div class="lesson-title">📚 ${item.title}</div>
                    <div>
                        <span class="badge badge-type">${item.type}</span>
                        <span class="badge badge-partner">${item.partner}</span>
                        ${item.location ? `<span class="badge">${item.location}</span>` : ''}
                    </div>
                </div>`;
                    });
                    html += '</div>';
                });
            }
            document.getElementById('scheduleContainer').innerHTML = html;
        }

        function showError(msg, container = document.getElementById('errorContainer')) {
            if (container) container.innerHTML = `<div class="error">${msg}</div>`;
        }

        // --- Инициализация автокомплита для групп и преподавателей ---
        const clientInput = document.getElementById('clientInput');
        const autocompleteList = document.getElementById('autocompleteList');
        const teacherInput = document.getElementById('teacherInput');
        const teacherAutocompleteList = document.getElementById('teacherAutocompleteList');

        if (clientInput && autocompleteList) {
            setupAutocomplete(
                clientInput,
                autocompleteList,
                (name) => {
                    clientInput.value = name;
                    state.selectedClient = name;
                    autocompleteList.classList.remove('visible');
                    save('lastClient', name);
                    if (document.getElementById('dateInput').value) loadSchedule();
                },
                (query) => state.clients.filter(c => c.toLowerCase().includes(query.toLowerCase())).slice(0, 50)
            );
        }

        if (teacherInput && teacherAutocompleteList) {
            setupAutocomplete(
                teacherInput,
                teacherAutocompleteList,
                (name) => {
                    teacherInput.value = name;
                    state.selectedTeacher = name;
                    teacherAutocompleteList.classList.remove('visible');
                    save('lastTeacher', name);
                    loadTeacherSchedule();
                },
                (query) => state.teachers.filter(t => t.toLowerCase().includes(query.toLowerCase())).slice(0, 50)
            );
        }

        // Закрытие автокомплита при клике вне полей
        document.addEventListener('click', (e) => {
            if (clientInput && !clientInput.contains(e.target) && autocompleteList && !autocompleteList.contains(e.target)) {
                autocompleteList.classList.remove('visible');
            }
            if (teacherInput && !teacherInput.contains(e.target) && teacherAutocompleteList && !teacherAutocompleteList.contains(e.target)) {
                teacherAutocompleteList.classList.remove('visible');
            }
        });

        // --- Переключение вкладок ---
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.getElementById(btn.dataset.tab).classList.add('active');
                btn.classList.add('active');
                document.getElementById('scheduleContainer').style.display = 'none';
                document.getElementById('disciplineScheduleContainer').style.display = 'none';
            });
        });

        // --- Обработчик выбора даты для дневного режима ---
        const dateInputElem = document.getElementById('dateInput');
        if (dateInputElem) {
            dateInputElem.value = new Date().toISOString().split('T')[0];
            dateInputElem.addEventListener('change', () => {
                if (state.selectedClient || clientInput?.value.trim()) loadSchedule();
            });
        }

        // --- Запуск при загрузке страницы ---
        loadClients().then(() => {
            if (state.selectedClient && dateInputElem?.value) loadSchedule();
            if (state.selectedTeacher) loadTeacherSchedule();
        });
    </script>
</body>

</html>
